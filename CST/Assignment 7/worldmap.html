<html>
<head>
    <title>World Map Explorer</title>
</head>
<body>

    <h1>World Map Explorer</h1>
    
    <img src="https://www.worldatlas.com/img/ncore/world_map.jpg" alt="World Map" usemap="#mapregions" width="1000" height="600">
    
    <map name="mapregions">
        <area shape="rect" coords="120,50,300,180" href="https://en.wikipedia.org/wiki/Canada" alt="Canada (Rectangle)" target="_blank">
    
        <area shape="circle" coords="320,360,50" href="https://en.wikipedia.org/wiki/Brazil" alt="Brazil (Circle)" target="_blank">
        
    
        <area shape="poly" coords="695,240,730,270,705,310,675,270" href="https://en.wikipedia.org/wiki/India" alt="India (Polygon)" target="_blank">
        
        <area shape="default" href="https://en.wikipedia.org/wiki/Earth" alt="Rest of the World (Default)" target="_blank">
    </map>

</body>
</html>
