<html>
<head>
    <title>Nested Tables</title>
</head>
<body>
    <table border="1" cellpadding="10" cellspacing="0" align="center">
        <tr>
            <th colspan="2">Employee Salary Slip</th>
        </tr>
        <tr>
            <td>
                <table border="1" cellpadding="5" cellspacing="0">
                    <tr>
                        <th>Earnings</th>
                        <th>Amount</th>
                    </tr>
                    <tr>
                        <td>Basic</td>
                        <td>5000</td>
                    </tr>
                </table>
            </td>
            <td>
                <table border="1" cellpadding="5" cellspacing="0">
                    <tr>
                        <th>Deductions</th>
                        <th>Amount</th>
                    </tr>
                    <tr>
                        <td>Tax</td>
                        <td>500</td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>

    <br>

    <table border="1" cellpadding="10" cellspacing="2" align="center">
        <tr>
            <th colspan="2">Student Profile & Marks</th>
        </tr>
        <tr>
            <td rowspan="2" align="center">Student Photo Here</td>
            <td>
                <table border="1" cellpadding="5" cellspacing="0">
                    <tr>
                        <th>Subject</th>
                        <th>Score</th>
                    </tr>
                    <tr>
                        <td>Math</td>
                        <td>95</td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>

    <br>

    <table border="2" cellpadding="8" cellspacing="1" align="center">
        <tr>
            <th colspan="3">Product Order Summary</th>
        </tr>
        <tr>
            <td>
                <table border="1" cellpadding="4" cellspacing="0">
                    <tr>
                        <th colspan="2">Order Details</th>
                    </tr>
                    <tr>
                        <td>Item</td>
                        <td>Laptop</td>
                    </tr>
                </table>
            </td>
            <td>Qty: 1</td>
            <td>Price: $1000</td>
        </tr>
    </table>

    <br>

    <table border="1" cellpadding="12" cellspacing="0" align="center">
        <tr>
            <th colspan="2">Hotel Booking</th>
        </tr>
        <tr>
            <td>Room Type</td>
            <td>
                <table border="1" cellpadding="5" cellspacing="0">
                    <tr>
                        <td>Deluxe</td>
                        <td>$200/night</td>
                    </tr>
                    <tr>
                        <td>Standard</td>
                        <td>$100/night</td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
