<!DOCTYPE html>
<html>
<head>
  <title>College Website</title>
</head>

<!-- Task 1 & 2: Divide screen into Header (top 20%) and Content (bottom 80%) -->
<frameset rows="20%, 80%">
  
  <!-- Task 1: Header frame -->
  <frame src="header.html" name="header_frame">

  <!-- Task 2: Divide remaining area into Navigation (25%) and Main Content (75%) columns -->
  <frameset cols="25%, 75%">
    <!-- Task 4 & 5: Navigation frame and Content frame with suitable names -->
    <frame src="nav.html" name="nav_frame">
    <frame src="home.html" name="content_frame">
  </frameset>

</frameset>

</html>
